<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SEB EvalPro — Tests / Parcours</title>
  <style>
    html,body{margin:0;width:100%;height:100%;min-height:100vh;font-family:Calibri,Arial,sans-serif;background:linear-gradient(180deg,#fff 0%,#ebeef5 100%);color:#222}
    body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:70px 24px 24px}
    main{width:min(760px,92vw);min-height:min(480px,calc(100vh - 140px));background:#fff;border:1px solid #d8dde8;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:34px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    h1{margin:0 0 34px;color:#0070c0;font-size:28px;font-weight:700}
    #close-tests-parcours{min-width:150px;height:40px;padding:0 18px;border:2px solid #0070c0;border-radius:6px;background:#fff;color:#0070c0;font:700 15px Calibri,Arial,sans-serif;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.16)}
    #close-tests-parcours:hover{background:#f5f9fd}
    #close-tests-parcours:disabled{opacity:.55;cursor:default}
  </style>
</head>
<body>
  <main>
    <h1>Tests / Parcours</h1>
    <button id="close-tests-parcours" type="button">Fermer</button>
  </main>
  <script src="js/admin-tests-parcours.js"></script>
</body>
</html>
