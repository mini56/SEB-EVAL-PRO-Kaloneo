appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot18
productName: "SEB EvalPro Kalonéo - PILOTE 18"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot18-main.js
  version: 0.0.18

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE 18"
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-18-0.0.18-Windows-Setup.${ext}"
