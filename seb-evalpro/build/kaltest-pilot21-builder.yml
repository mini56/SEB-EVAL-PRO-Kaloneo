appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot21
productName: "SEB EvalPro Kalonéo - PILOTE 21 R1"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot21-main.js
  version: 0.0.21

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE 21 R1"
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-21-R1-0.0.21-Windows-Setup.${ext}"
