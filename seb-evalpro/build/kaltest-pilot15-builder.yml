appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot15
productName: "SEB EvalPro Kalonéo - PILOTE 15"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot15-main.js
  version: 0.0.15

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE 15"
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-15-0.0.15-Windows-Setup.${ext}"
