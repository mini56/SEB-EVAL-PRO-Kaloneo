appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot14
productName: "SEB EvalPro Kalonéo - PILOTE 14"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot14-main.js
  version: 0.0.14

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE 14"
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-14-0.0.14-Windows-Setup.${ext}"
