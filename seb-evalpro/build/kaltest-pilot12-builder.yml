appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot12
productName: "SEB EvalPro Kalonéo - PILOTE 12"
asar: true
compression: store

directories:
  buildResources: build/pilot-resources

extraMetadata:
  main: src/kaltest-pilot12-main.js
  version: 0.0.12

files:
  - src/**/*
  - app/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE 12"
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-12-0.0.12-Windows-Setup.${ext}"
