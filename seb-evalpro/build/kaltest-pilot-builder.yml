appId: fr.sauvegarde56.sebevalpro.kaloneo.pilot
productName: "SEB EvalPro Kalonéo - PILOTE"
asar: true
compression: store

extraMetadata:
  main: src/kaltest-pilot-main.js
  version: 0.0.1

files:
  - src/kaltest-pilot-main.js
  - app/**/*
  - package.json

win:
  target:
    - nsis
  icon: build/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "SEB EvalPro Kalonéo - PILOTE"
  installerIcon: build/app-icon.ico
  uninstallerIcon: build/app-icon.ico
  installerHeader: build/installerHeader.bmp
  deleteAppDataOnUninstall: true
  artifactName: "SEB-EvalPro-Kaloneo-PILOTE-0.0.1-Windows-Setup.${ext}"
