name: Build Windows KALTEST Pilot 21 KALONÉO Builder sync
# Windows smoke isolation v5

on:
  workflow_dispatch:
  push:
    branches:
      - pilot21-kaloneo-builder-sync

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA
        run: npm run test:seb-ia

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Verify KALONÉO Builder parity
        run: npm run test:kaloneo-builder-parity

      - name: Prepare real web app
        run: npm run prepare:web

      - name: Verify candidate catalog
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run full real Electron regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $smokes = @(
            'scripts/build21-admin-foundation-smoke-main.js',
            'scripts/pilot13-layout-smoke-main.js',
            'scripts/pilot16-responsive-smoke-main.js',
            'scripts/kaltest-pilot2-functional-smoke-main.js',
            'scripts/pilot8-visual-intro-smoke-main.js',
            'scripts/pilot10-page1-render-main.js',
            'scripts/qcm-page4-functional-smoke-main.js',
            'scripts/qcm-page5-functional-smoke-main.js',
            'scripts/qcm-page5-1-functional-smoke-main.js',
            'scripts/autoeval1-functional-smoke-main.js',
            'scripts/planning-functional-smoke-main.js',
            'scripts/dictee-functional-smoke-main.js',
            'scripts/brique-functional-smoke-main.js',
            'scripts/real-brique-electron-render-main.js',
            'scripts/stock-functional-smoke-main.js',
            'scripts/real-stock-electron-test-main.js',
            'scripts/tri-functional-smoke-main.js',
            'scripts/nwtexte-functional-smoke-main.js',
            'scripts/nvmail-functional-smoke-main.js',
            'scripts/autoeval2-functional-smoke-main.js',
            'scripts/carre-functional-smoke-main.js',
            'scripts/qcm-final-functional-smoke-main.js',
            'scripts/full-pilot-journey-smoke-main.js'
          )
          foreach ($smoke in $smokes) {
            Write-Host "=== REAL ELECTRON: $smoke ==="
            $safe = ($smoke -replace '[^A-Za-z0-9_-]','_')
            $stdout = Join-Path $env:RUNNER_TEMP "$safe-out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$safe-err.log"
            $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox',$smoke -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Timeout du smoke $smoke"
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "Smoke $smoke en echec (code $($process.ExitCode))." }
          }

      - name: Verify Pilot 21 launcher contract
        shell: pwsh
        run: |
          $main = Get-Content -Raw 'src/kaltest-pilot21-main.js'
          $core = Get-Content -Raw 'src/main.js'
          if ($main -notmatch "SEB_KALTEST_FULL_PARCOURS = '1'") { throw 'PILOTE 21 ne force pas le mode parcours complet.' }
          if ($core -notmatch "fullParcours:'1'") { throw 'main.js ne transmet pas fullParcours=1.' }
          Write-Host 'PILOT21_FULL_PARCOURS_LAUNCHER=OK'

      - name: Build isolated Windows Pilot 21 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot21-builder.yml --publish never

      - name: Verify Pilot 21 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-21-0.0.21-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 21 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT21_SETUP=$($setup.Name)"
          Write-Host "PILOT21_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-21-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-21-0.0.21-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 21 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-021'
          $title = 'SEB EvalPro Kalonéo — PILOTE #21'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #21 Windows — remise à niveau complète KALONÉO / SEB EvalPro.

          Objectif : KALONÉO et SEB EvalPro sont désormais compilés et contrôlés ensemble.

          Contrôles bloquants :
          - le générateur KALONÉO est copié dans app/web/kaloneo-builder et embarqué avec SEB EvalPro ;
          - la page Administrateur Tests / Parcours ouvre le générateur KALONÉO ;
          - les 19 archétypes validés sont enregistrés et doivent être générables par KALONÉO ;
          - les fixtures KALTEST existantes doivent être importables puis régénérables sans perte ;
          - tableaux/grilles, cellules fixes/vides/réponses, médias, largeurs en caractères et reste disponible sont contrôlés ;
          - compteur commun KALONÉO 44 px et barre basse commune 52 px restent les références ;
          - aucun masquage CSS n'est accepté comme implémentation d'une capacité Builder ;
          - toute divergence Builder / KALTEST / SEB EvalPro rend la compilation ROUGE.

          Le build exécute ensuite la suite Electron réelle complète avant publication.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot21-kaloneo-builder-sync --title $title --notes $notes
