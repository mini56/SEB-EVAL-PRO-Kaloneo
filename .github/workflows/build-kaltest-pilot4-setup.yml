name: Build Windows KALTEST Pilot 4 setup

on:
  workflow_dispatch:
  push:
    branches:
      - dev-kaloneo-v2
    paths:
      - '.github/workflows/build-kaltest-pilot4-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 55

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Build 21 Admin foundation
        run: npm run test:admin-foundation

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Admin bar smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot4-admin-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot4-admin-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/admin-bar-smoke-electron.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Admin PILOTE 4.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke Admin PILOTE 4 en echec (code $($process.ExitCode))." }

      - name: Generate Pilot 4 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Run real Electron KALTEST smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot4-kaltest-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot4-kaltest-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke KALTEST PILOTE 4.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke KALTEST PILOTE 4 en echec (code $($process.ExitCode))." }

      - name: Build isolated Windows Pilot 4 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot4-builder.yml --publish never

      - name: Verify Pilot 4 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-4-0.0.4-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 4 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT4_SETUP=$($setup.Name)"
          Write-Host "PILOT4_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-4-0.0.4-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-4-0.0.4-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 4 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-004'
          $title = 'SEB EvalPro Kalonéo — PILOTE #4 — socle Admin Build #21'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #4 : restauration fonctionnelle du socle Administrateur depuis le Build #21 validé.

          Priorité de ce pilote :
          - barre Admin et navigation restaurées depuis Build #21
          - catalogue Ouvrir un candidat restauré
          - flux Résultats / Replay / Bilan conservés depuis les modules Build #21
          - logique contextuelle instable PILOTE #3 retirée
          - temporisation barre 1000 ms conservée
          - Fermer la session active termine le parcours sans fermer SEB EvalPro
          - Quitter reste la seule commande de fermeture de l'application
          - garde-fou Build #21 exécuté sur chaque prepare:web
          - adaptations KALTEST limitées à fin de parcours et Replay

          Aucun nouveau travail de mise en page des exercices n'a été ajouté dans ce lot.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target dev-kaloneo-v2 --title $title --notes $notes
