name: Build Windows KALONÉO Parcours V1 Test

on:
  workflow_dispatch:
  push:
    branches:
      - parcours-builder-v1
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-parcours-builder-v1-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library and business rules
        run: npm run test:parcours-builder

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify parcours builder in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify KALONÉO Builder full Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build isolated Windows Parcours V1 setup
        run: npx electron-builder --win nsis --config build/kaloneo-parcours-v1-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-PARCOURS-V1-0.0.22-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup Parcours V1 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PARCOURS_V1_SETUP=$($setup.Name)"
          Write-Host "PARCOURS_V1_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-PARCOURS-V1-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-PARCOURS-V1-0.0.22-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-001'
          $title = 'SEB EvalPro Kalonéo — Parcours V1 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST pour le chantier Bibliothèque / Créateur de parcours.

          Inclus :
          - Bibliothèque KALTEST interne à SEB EvalPro ;
          - Introduction et Fin de parcours comme types spéciaux remplaçables ;
          - ajout des tests par vignette / glisser-déposer sans doublon ;
          - réordonnancement et retrait ;
          - nom de parcours unique et créateur interne obligatoire ;
          - persistance des parcours enregistrés ;
          - vrai aperçu plein écran Electron depuis le Test Builder ;
          - bouton Fermer l’aperçu avec retour au brouillon intact.

          Ce Setup est un pilote de test et ne remplace pas PILOTE 21 R3 comme référence validée.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target parcours-builder-v1 --title $title --notes $notes
