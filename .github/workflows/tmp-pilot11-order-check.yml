name: Temporary Pilot 11 parcours order validation

on:
  push:
    branches:
      - pilot11-parcours-order-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare app and run architecture guards
        run: npm run prepare:web
      - name: Verify standalone Pilot 10 remains compatible
        run: xvfb-run -a npx electron --no-sandbox scripts/kaltest-pilot2-functional-smoke-main.js
      - name: Verify corrected Pilot 11 full journey
        run: xvfb-run -a npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
      - name: Verify LEGO still functional
        run: xvfb-run -a npx electron --no-sandbox scripts/brique-functional-smoke-main.js
      - name: Verify Stock still functional
        run: xvfb-run -a npx electron --no-sandbox scripts/stock-functional-smoke-main.js
