name: Test Builder R4 checks

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r4

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library test persistence and mask rules
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Rebuild real web application and guards
        run: npm run prepare:web

      - name: Verify parcours builder R4 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify Test Builder R4 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify mask screen builder in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-mask-builder-electron-smoke-main.js

      - name: Verify full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours
