name: Real LEGO Electron render

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - 'seb-evalpro/source/brique.html'
      - 'seb-evalpro/source/css/kaloneo-practical-exercise.css'
      - 'seb-evalpro/source/js/brique-page.js'
      - 'seb-evalpro/source/js/brique-runtime.js'
      - 'seb-evalpro/source/js/brique-runtime-tail.js'
      - 'seb-evalpro/scripts/real-brique-electron-render-main.js'
      - '.github/workflows/real-lego-electron-render.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare real SEB EvalPro web app
        run: npm run prepare:web

      - name: Capture real LEGO page in Electron
        run: xvfb-run -a npx electron --no-sandbox scripts/real-brique-electron-render-main.js

      - name: Commit real-program LEGO proof
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/render-check-real/REAL-PROGRAM-LEGO-*
          git diff --cached --quiet || git commit -m "Capture real SEB EvalPro LEGO page in Electron"
          git pull --rebase origin pilot10-page1-readability
          git push origin HEAD:pilot10-page1-readability
