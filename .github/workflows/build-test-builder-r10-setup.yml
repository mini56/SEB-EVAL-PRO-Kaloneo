name: Build Windows KALONÉO PILOTE 22 R10

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r10-results
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-test-builder-r10-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify R10 results presentation contract
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check source/js/qcm-runtime.js
          $main = Get-Content src/main.js -Raw
          $preload = Get-Content src/preload.js -Raw
          $runtime = Get-Content source/js/qcm-runtime.js -Raw
          foreach ($needle in @('kaloneo-library:test-metadata-sync')) {
            if (-not $main.Contains($needle)) { throw "Métadonnées catalogue absentes de main.js : $needle" }
          }
          foreach ($needle in @('kaloneoTestMetadataSync')) {
            if (-not $preload.Contains($needle)) { throw "Pont catalogue absent de preload.js : $needle" }
          }
          foreach ($needle in @('sebReadCatalogMetadata','Le nom du test est toujours le premier élément du bloc','TIC / Bureautique','Raisonnement')) {
            if (-not $runtime.Contains($needle)) { throw "Présentation Résultats R10 absente : $needle" }
          }

      - name: Verify parcours library selection launch options and runtime
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify dynamic final page closes active candidate
        run: npx electron --no-sandbox scripts/kaloneo-final-completion-electron-smoke-main.js

      - name: Verify Admin Bilan keeps vertical scrolling
        run: npx electron --no-sandbox scripts/admin-bilan-windows-smoke.js

      - name: Verify candidate catalog including parcours name
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify selected parcours candidate runtime in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js

      - name: Verify historical full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R10 setup
        run: npx electron-builder --win nsis --config build/kaloneo-test-builder-r10-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R10-0.0.30-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R10 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R10-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R10-0.0.30-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r10'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R10 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R10.

          Correction présentation Résultats :
          - vrai nom KALONÉO affiché en tête de chaque bloc ;
          - vraie section/catégorie récupérée depuis le catalogue quand l'ancien dossier ne la possède pas ;
          - score affiché sous le titre du test ;
          - identifiants techniques de questions masqués et remplacés par Q1, Q2, etc. ;
          - anciens titres et scores doublons supprimés de l'affichage ;
          - lecture KALTEST canonique et filtrage par parcours de R9 conservés.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target test-builder-r10-results --title $title --notes $notes
