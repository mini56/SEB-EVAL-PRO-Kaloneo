name: Build Windows KALTEST Pilot 10 setup

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - '.github/workflows/build-kaltest-pilot10-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA and repository identity audit
        run: npm run test:seb-ia

      - name: Generate Pilot KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real SEB web application and all architecture guards
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Pilot 10 regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $smokes = @(
            'scripts/build21-admin-foundation-smoke-main.js',
            'scripts/kaltest-pilot2-functional-smoke-main.js',
            'scripts/pilot8-visual-intro-smoke-main.js',
            'scripts/pilot10-page1-render-main.js',
            'scripts/real-test1-electron-render-main.js',
            'scripts/brique-functional-smoke-main.js',
            'scripts/real-brique-electron-render-main.js',
            'scripts/stock-functional-smoke-main.js',
            'scripts/real-stock-electron-test-main.js'
          )

          foreach ($smoke in $smokes) {
            Write-Host "=== REAL ELECTRON: $smoke ==="
            $safe = ($smoke -replace '[^A-Za-z0-9_-]','_')
            $stdout = Join-Path $env:RUNNER_TEMP "$safe-out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$safe-err.log"
            $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox',$smoke -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Timeout du smoke $smoke"
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) {
              throw "Smoke $smoke en echec (code $($process.ExitCode))."
            }
          }

      - name: Build isolated Windows Pilot 10 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot10-builder.yml --publish never

      - name: Verify Pilot 10 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-10-0.0.10-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 10 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT10_SETUP=$($setup.Name)"
          Write-Host "PILOT10_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-10-0.0.10-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-10-0.0.10-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 10 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-010'
          $title = 'SEB EvalPro Kalonéo — PILOTE #10'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #10 Windows — test réel de la nouvelle fabrique et des gabarits KALONÉO.

          Pages et gabarits intégrés / contrôlés :
          - Page 1 KALONÉO validée
          - Page 2 conservée dans son état actuel
          - Tests 1 et 2 : contenu 60 % gauche / visuel 40 % droite
          - Horaires : visuel 40 % gauche / tableau 60 % droite
          - LEGO / Briques : Scénario + Consigne pleine largeur, puis 50/50 image / contrôles
          - Stock : Scénario + Consigne pleine largeur, puis 35/65 pots-tri / casiers
          - calculatrice positionnée pour ne pas masquer les réponses
          - typographie candidat : aucun texte fonctionnel sous 15 px dans les nouveaux gabarits

          Contrôles avant publication :
          - architecture complète prepare:web
          - Admin foundation
          - SEB-IA
          - catalogue candidat
          - Quitter / session active
          - KALTEST réel Electron
          - introduction
          - Page 1
          - premiers tests / horaires
          - LEGO fonctionnel et rendu réel
          - Stock fonctionnel : 33/33, 0 erreur, sauvegarde/reprise

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot10-page1-readability --title $title --notes $notes
