name: Build Windows KALTEST Pilot 8 setup

on:
  workflow_dispatch:
  push:
    branches:
      - pilot8-video-intro
    paths:
      - '.github/workflows/build-kaltest-pilot8-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Build 21 Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA and repository identity audit
        run: npm run test:seb-ia

      - name: Generate Pilot 8 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Admin foundation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot8-admin-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot8-admin-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/build21-admin-foundation-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Admin PILOTE 8.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke Admin PILOTE 8 en echec (code $($process.ExitCode))." }

      - name: Run real Electron KALTEST regression smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot8-kaltest-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot8-kaltest-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke KALTEST PILOTE 8.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke KALTEST PILOTE 8 en echec (code $($process.ExitCode))." }

      - name: Run real Electron Pilot 8 visual intro smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot8-visual-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot8-visual-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/pilot8-visual-intro-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke visuel PILOTE 8.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke visuel PILOTE 8 en echec (code $($process.ExitCode))." }

      - name: Build isolated Windows Pilot 8 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot8-builder.yml --publish never

      - name: Verify Pilot 8 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-8-0.0.8-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 8 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT8_SETUP=$($setup.Name)"
          Write-Host "PILOT8_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-8-0.0.8-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-8-0.0.8-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-008'
          $title = 'SEB EvalPro Kalonéo — PILOTE #8'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #8 Windows pour test réel.

          Ajustements après le test réel du PILOTE #7 :
          - les blocs Chronomètre / Calculatrice / Audio sont remontés
          - badge 2 du chronomètre protégé contre le rognage
          - Démarrer le chronomètre en vert
          - Arrêter le chronomètre en rouge
          - test calculatrice avec le même bouton que dans les exercices réels
          - bouton Afficher l’écran d’accueil au style KALONÉO
          - seconde démonstration de calculatrice supprimée de l’Introduction
          - ancienne image de couverture supprimée de cette page
          - mini vidéo/animation locale d’arrivée à l’usine
          - lecture automatique silencieuse, une seule fois, sans boucle
          - socle Admin / Bilan / Quitter / KALTEST conservé

          Décisions consignées dans docs/PILOTE-8-DECISIONS.md.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot8-video-intro --title $title --notes $notes
