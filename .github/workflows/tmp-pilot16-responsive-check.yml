name: Temporary Pilot 16 responsive validation

on:
  push:
    branches:
      - pilot16-responsive-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare web and run guards
        run: npm run prepare:web

      - name: Pilot 16 responsive multi-resolution smoke
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 2200x1400x24" npx electron --no-sandbox scripts/pilot16-responsive-smoke-main.js 2>&1 | tee /tmp/pilot16-responsive.log
          grep -q "PILOT16_RESPONSIVE_SMOKE: OK" /tmp/pilot16-responsive.log
          if grep -q "PILOT16_RESPONSIVE_SMOKE: FAIL" /tmp/pilot16-responsive.log; then exit 2; fi

      - name: KALTEST functional
        run: xvfb-run -a npx electron --no-sandbox scripts/kaltest-pilot2-functional-smoke-main.js

      - name: Fractions functional
        run: xvfb-run -a npx electron --no-sandbox scripts/qcm-page4-functional-smoke-main.js

      - name: Organisation functional
        run: xvfb-run -a npx electron --no-sandbox scripts/qcm-page5-functional-smoke-main.js

      - name: Gestes postures functional
        run: xvfb-run -a npx electron --no-sandbox scripts/qcm-page5-1-functional-smoke-main.js

      - name: Conversions legacy functional
        run: xvfb-run -a npx electron --no-sandbox scripts/qcm-page6-functional-smoke-main.js

      - name: Autoeval1 functional
        run: xvfb-run -a npx electron --no-sandbox scripts/autoeval1-functional-smoke-main.js

      - name: Briques functional
        run: xvfb-run -a npx electron --no-sandbox scripts/brique-functional-smoke-main.js

      - name: Stock functional
        run: xvfb-run -a npx electron --no-sandbox scripts/stock-functional-smoke-main.js

      - name: Planning functional
        run: xvfb-run -a npx electron --no-sandbox scripts/planning-functional-smoke-main.js

      - name: Genre nombre functional
        run: xvfb-run -a npx electron --no-sandbox scripts/genrenombres-functional-smoke-main.js

      - name: Dictee functional
        run: xvfb-run -a npx electron --no-sandbox scripts/dictee-functional-smoke-main.js

      - name: Tri functional
        run: xvfb-run -a npx electron --no-sandbox scripts/tri-functional-smoke-main.js

      - name: Traitement texte functional
        run: xvfb-run -a npx electron --no-sandbox scripts/nwtexte-functional-smoke-main.js

      - name: Email functional
        run: xvfb-run -a npx electron --no-sandbox scripts/nvmail-functional-smoke-main.js

      - name: Autoeval2 functional
        run: xvfb-run -a npx electron --no-sandbox scripts/autoeval2-functional-smoke-main.js

      - name: Puzzle functional
        run: xvfb-run -a npx electron --no-sandbox scripts/carre-functional-smoke-main.js

      - name: Full parcours
        run: xvfb-run -a npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
