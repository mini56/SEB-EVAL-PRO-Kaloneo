name: KALONÉO Page Factory check

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - 'seb-evalpro/source/kaloneo/**'
      - 'seb-evalpro/scripts/kaloneo-build-page.js'
      - 'seb-evalpro/scripts/kaloneo-build-test-page.js'
      - '.github/workflows/kaloneo-page-factory-check.yml'

permissions:
  contents: write

jobs:
  generate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate pages only through KALONÉO
        working-directory: seb-evalpro
        run: |
          node scripts/kaloneo-build-page.js source/kaloneo/definitions/page1-start.js source/kaloneo/generated/page1-start.generated.html
          node scripts/kaloneo-build-page.js source/kaloneo/definitions/page2-intro.js source/maquette-page2-kaloneo.html
          node scripts/kaloneo-build-test-page.js tests/fixtures/kaltests/calculs-commandes-atelier/1.0.0/test.json source/maquette-test1-kaloneo.html 1 7

      - name: Publish generated Page 1 to existing preview path
        shell: bash
        run: |
          cp seb-evalpro/source/kaloneo/generated/page1-start.generated.html \
             seb-evalpro/source/maquette-page1-kaloneo.html

      - name: Verify generated architecture
        working-directory: seb-evalpro
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='source/kaloneo/generated/page1-start.generated.html';
          const html=fs.readFileSync(p,'utf8');
          if(!html.includes('id="kaloneo-page-root"')) throw new Error('Racine KALONÉO absente');
          if(!html.includes('window.KALONEO_PAGE_DEFINITION')) throw new Error('Définition non embarquée');
          if(!html.includes('kaloneoGenerated')) throw new Error('Moteur KALONÉO non embarqué');
          if(!html.includes('GENERATED BY KALONÉO PAGE FACTORY')) throw new Error('Marqueur générateur absent');
          const page2='source/maquette-page2-kaloneo.html';
          const html2=fs.readFileSync(page2,'utf8');
          if(!html2.includes('GENERATED BY KALONÉO PAGE FACTORY')) throw new Error('Page 2 non générée par KALONÉO');
          if(!html2.includes('candidate-introduction')) throw new Error('Définition Page 2 absente');
          if(!html2.includes('factory-arrival')) throw new Error('Bloc animation Page 2 absent');
          const test1='source/maquette-test1-kaloneo.html';
          const html3=fs.readFileSync(test1,'utf8');
          if(!html3.includes('GENERATED BY KALONÉO TEST FACTORY')) throw new Error('Test 1 non généré par KALONÉO');
          if(!html3.includes('calculs_commandes_atelier')) throw new Error('KALTEST source absent du Test 1');
          if(!html3.includes('Ouvrir la calculatrice')) throw new Error('Calculatrice non générée pour Test 1');
          if(!html3.includes('Abandonner l’exercice')) throw new Error('Abandon non généré pour Test 1');
          console.log('KALONEO_FACTORY_ARCHITECTURE: OK');
          NODE

      - name: Prepare interactive render states
        shell: bash
        run: |
          mkdir -p .render docs/render-check
          cp seb-evalpro/source/kaloneo/generated/page1-start.generated.html .render/initial.html
          python - <<'PY'
          from pathlib import Path
          src=Path("seb-evalpro/source/kaloneo/generated/page1-start.generated.html").read_text(encoding="utf-8")

          calc_script = """
          <script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Ouvrir la calculatrice');
            if(b)b.click();
          },120));
          </script>
          """
          Path(".render/calc.html").write_text(src.replace("</body>",calc_script+"</body>"),encoding="utf-8")

          done_script = """
          <script>
          window.addEventListener('load',()=>setTimeout(()=>{
            window.KaloneoPageRuntime?.place('house');
            window.KaloneoPageRuntime?.place('car');
            const buttons=[...document.querySelectorAll('button')];
            const start=buttons.find(x=>x.textContent.trim()==='Démarrer');
            const stop=buttons.find(x=>x.textContent.trim()==='Arrêter');
            if(start)start.click();
            setTimeout(()=>{
              if(stop)stop.click();
              const calc=buttons.find(x=>x.textContent.trim()==='Ouvrir la calculatrice');
              if(calc)calc.click();
              window.KaloneoPageRuntime?.closeCalculator('main-calculator');
              const cb=document.querySelector('.k-audio-controls input[type=checkbox]');
              if(cb){cb.checked=true;cb.dispatchEvent(new Event('change',{bubbles:true}));}
            },350);
          },120));
          </script>
          """
          Path(".render/completed.html").write_text(src.replace("</body>",done_script+"</body>"),encoding="utf-8")
          PY

      - name: Render generated Page 1 at 1366x768
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for STATE in initial calc completed; do
            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --window-size=1366,768               --virtual-time-budget=900               --screenshot="docs/render-check/kaloneo-generated-page1-${STATE}-1366x768.png"               "file://$GITHUB_WORKSPACE/.render/${STATE}.html"
          done

      - name: Render generated Page 2 at 1366x768
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1366,768 \
            --virtual-time-budget=1200 \
            --screenshot="docs/render-check/kaloneo-generated-page2-playing-1366x768.png" \
            "file://$GITHUB_WORKSPACE/seb-evalpro/source/maquette-page2-kaloneo.html"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1366,768 \
            --virtual-time-budget=7600 \
            --screenshot="docs/render-check/kaloneo-generated-page2-finished-1366x768.png" \
            "file://$GITHUB_WORKSPACE/seb-evalpro/source/maquette-page2-kaloneo.html"

      - name: Render generated Test 1 at 1366x768
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p .render
          cp seb-evalpro/source/maquette-test1-kaloneo.html .render/test1-initial.html
          python - <<'PY'
          from pathlib import Path
          src=Path("seb-evalpro/source/maquette-test1-kaloneo.html").read_text(encoding="utf-8")
          calc = """
          <script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Ouvrir la calculatrice');
            if(b)b.click();
          },120));
          </script>
          """
          abandon = """
          <script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='Abandonner l’exercice');
            if(b)b.click();
          },120));
          </script>
          """
          Path(".render/test1-calc.html").write_text(src.replace("</body>",calc+"</body>"),encoding="utf-8")
          Path(".render/test1-abandon.html").write_text(src.replace("</body>",abandon+"</body>"),encoding="utf-8")
          PY
          for STATE in initial calc abandon; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=1366,768 \
              --virtual-time-budget=1000 \
              --screenshot="docs/render-check/kaloneo-generated-test1-${STATE}-1366x768.png" \
              "file://$GITHUB_WORKSPACE/.render/test1-${STATE}.html"
          done

      - name: Verify visible generated page
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=1366,768             --dump-dom "file://$GITHUB_WORKSPACE/.render/initial.html" > .render/dom.txt
          grep -q 'data-kaloneo-generated="1"' .render/dom.txt
          grep -q '>Démarrer<' .render/dom.txt
          grep -q '>Arrêter<' .render/dom.txt
          grep -q '>Ouvrir la calculatrice<' .render/dom.txt
          echo 'KALONEO_GENERATED_RENDER: OK'

      - name: Commit generated proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seb-evalpro/source/kaloneo/generated/page1-start.generated.html
          git add seb-evalpro/source/maquette-page1-kaloneo.html
          git add seb-evalpro/source/maquette-page2-kaloneo.html
          git add seb-evalpro/source/maquette-test1-kaloneo.html
          git add docs/render-check/kaloneo-generated-page1-*-1366x768.png
          git add docs/render-check/kaloneo-generated-page2-*-1366x768.png
          git add docs/render-check/kaloneo-generated-test1-*-1366x768.png
          git diff --cached --quiet || git commit -m "Generate and render KALONÉO factory pages"
          git push origin HEAD:pilot10-page1-readability
