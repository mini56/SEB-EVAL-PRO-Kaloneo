name: Build Windows KALTEST Pilot 2 setup

on:
  push:
    branches:
      - dev-kaloneo-v2
    paths:
      - 'seb-evalpro/build/kaltest-pilot2-builder.yml'
      - 'seb-evalpro/source/kaltest-pilot2.html'
      - 'seb-evalpro/source/css/kaltest-pilot2.css'
      - 'seb-evalpro/source/css/seb-design-system.css'
      - 'seb-evalpro/source/css/seb-floating-calculator.css'
      - 'seb-evalpro/source/js/kaltest-pilot2-runtime.js'
      - 'seb-evalpro/source/js/seb-floating-calculator.js'
      - 'seb-evalpro/source/js/seb-ui-runtime.js'
      - 'seb-evalpro/src/main.js'
      - 'seb-evalpro/src/preload.js'
      - 'seb-evalpro/src/kaltest-pilot2-main.js'
      - 'seb-evalpro/scripts/build-kaltest-pilot2-data.js'
      - 'seb-evalpro/scripts/kaltest-pilot2-functional-smoke-main.js'
      - 'kaltest-contract/**'
      - 'tests/fixtures/kaltests/**'
      - '.github/workflows/build-kaltest-pilot2-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 50

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Validate KALTEST contract
        working-directory: kaltest-contract
        run: npm test

      - name: Generate Pilot 2 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Run real Electron Pilot 2 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot2-smoke-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot2-smoke-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Electron PILOTE 2 après 150 secondes.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "Smoke Electron PILOTE 2 en echec (code $($process.ExitCode))."
          }

      - name: Build isolated Windows Pilot 2 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot2-builder.yml --publish never

      - name: Verify Pilot 2 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-2-0.0.2-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) {
            throw 'Setup PILOTE 2 introuvable.'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT2_SETUP=$($setup.Name)"
          Write-Host "PILOT2_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-2-0.0.2-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-2-0.0.2-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-002'
          $title = 'SEB EvalPro Kalonéo — PILOTE #2'
          if (gh release view $tag 2>$null) {
            throw "La Release $tag existe deja. Utiliser un nouveau numero de pilote."
          }
          $notes = @"
          PILOTE #2 Windows destiné au test réel du moteur KALTEST.

          Parcours inclus :
          Identification
          → Introduction
          → 7 tests KALTEST migrés du Build #20
          → Page finale

          Tests inclus :
          - Calculs de commandes en atelier
          - Calculs poids / volumes
          - Horaires réception / contrôle
          - Texte à trous — stage logistique
          - Conversions atelier / expédition
          - Genre / Nombre
          - Paronymes

          Ce pilote possède un identifiant Windows et un dossier de données isolés du SEB EvalPro utilisé en production.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target dev-kaloneo-v2 --title $title --notes $notes
