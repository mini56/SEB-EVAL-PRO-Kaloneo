name: Build Windows KALTEST pilot setup

on:
  push:
    branches:
      - main
    paths:
      - 'seb-evalpro/source/kaltest-pilot.html'
      - 'seb-evalpro/source/js/kaltest-pilot-*.js'
      - 'seb-evalpro/source/kaltest/**'
      - 'seb-evalpro/src/kaltest-pilot-main.js'
      - 'seb-evalpro/build/kaltest-pilot-builder.yml'
      - 'seb-evalpro/scripts/kaltest-pilot-*.js'
      - 'kaltest-contract/**'
      - '.github/workflows/build-kaltest-pilot-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 50

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Validate KALTEST contract
        working-directory: kaltest-contract
        run: npm test

      - name: Verify pilot data consistency
        run: node scripts/kaltest-pilot-data-consistency.js

      - name: Prepare web application
        run: npm run prepare:web

      - name: Run real Electron pilot test
        run: npx electron --no-sandbox scripts/kaltest-pilot-functional-smoke-main.js

      - name: Build isolated Windows pilot setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot-builder.yml --publish never

      - name: Verify pilot setup
        id: setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-0.0.1-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) {
            throw 'Setup pilote introuvable.'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT_SETUP=$($setup.Name)"
          Write-Host "PILOT_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-0.0.1-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-0.0.1-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish pilot release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-001'
          $title = 'SEB EvalPro Kalonéo — PILOTE #1'
          $notes = @"
          Première version Windows destinée au test réel du nouveau moteur KALTEST.

          Parcours inclus :
          Identification (7 premiers chiffres du n° de sécurité sociale)
          → Introduction
          → Calculs de commandes en atelier
          → Page finale

          Ce programme possède un identifiant Windows et un dossier d'installation distincts de SEB EvalPro actuellement utilisé.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@

          gh release create $tag $env:SETUP_PATH --title $title --notes $notes
