name: Build Windows KALONÉO PILOTE 22 R4

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r4
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-test-builder-r4-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library test persistence and mask rules
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify parcours builder R4 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify Test Builder R4 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify mask screen builder in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-mask-builder-electron-smoke-main.js

      - name: Verify manual free-text Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-manual-bilan-electron-smoke-main.js

      - name: Verify full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R4 setup
        run: npx electron-builder --win nsis --config build/kaloneo-test-builder-r4-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R4-0.0.25-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R4 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOTE_22_R4_SETUP=$($setup.Name)"
          Write-Host "PILOTE_22_R4_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R4-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R4-0.0.25-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r4'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R4 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R4.

          Inclus :
          - nouveaux tests enregistrés dans la bibliothèque interne KALONÉO ;
          - ouverture explicite d’un test enregistré depuis la bibliothèque ;
          - réponse « Texte libre — évaluation Administrateur » ;
          - réponse conservée telle quelle et évaluation manuelle NE / I / II / III dans le Bilan ;
          - nouvelle bibliothèque « Écrans de masquage » ;
          - écran KALONÉO fourni par défaut ;
          - écrans personnalisés limités à texte, image ou texte + image ;
          - choix de l’écran de masquage par parcours, hors séquence Introduction → tests → Fin ;
          - libellé candidat existant « Masquer l’écran d’accueil » conservé ;
          - corrections et validations R3 conservées ;
          - données internes conservées lors des mises à jour / désinstallations de test.

          Ce Setup reste un pilote de test et ne remplace pas PILOTE 21 R3 comme référence stable tant que le test réel n’est pas validé.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target test-builder-r4 --title $title --notes $notes
