name: Build Windows KALONÉO PILOTE 22 R3

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r3
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-test-builder-r3-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library and business rules
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify parcours builder R2 remains green
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify Test Builder R3 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R3 setup
        run: npx electron-builder --win nsis --config build/kaloneo-test-builder-r3-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R3-0.0.24-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R3 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOTE_22_R3_SETUP=$($setup.Name)"
          Write-Host "PILOTE_22_R3_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R3-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R3-0.0.24-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r3'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R3 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R3.

          Corrections Test Builder incluses :
          - ouverture sur un nouveau test vierge par défaut ;
          - retour depuis l’aperçu avec conservation du brouillon courant ;
          - bouton Nouveau immédiatement saisissable, titre actif sans quitter/revenir ;
          - scroll vertical interne à la zone Conception, sans scroll général de page aux résolutions de travail ;
          - image et vidéo contenues dans leur bloc avec proportions conservées ;
          - dernier / unique bloc conserve la règle de prise de l’espace restant sans étirer le média ;
          - aperçu Builder et vrai aperçu Electron harmonisés ;
          - calculatrice, boutons, drag de parcours, persistance et règles R2 conservés.

          Ce Setup reste un pilote de test et ne remplace pas PILOTE 21 R3 comme référence validée.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target test-builder-r3 --title $title --notes $notes
