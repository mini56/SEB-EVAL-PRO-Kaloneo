# PILOT9_RETRY_2
name: Build Windows KALTEST Pilot 9 setup

on:
  workflow_dispatch:
  push:
    branches:
      - pilot9-page1-layout
    paths:
      - '.github/workflows/build-kaltest-pilot9-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Build 21 Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA and repository identity audit
        run: npm run test:seb-ia

      - name: Generate Pilot data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Admin foundation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot9-admin-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot9-admin-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/build21-admin-foundation-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Admin PILOTE 9.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke Admin PILOTE 9 en echec (code $($process.ExitCode))." }

      - name: Run real Electron KALTEST regression smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot9-kaltest-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot9-kaltest-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke KALTEST PILOTE 9.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke KALTEST PILOTE 9 en echec (code $($process.ExitCode))." }

      - name: Run real Electron Pilot 8 intro regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot9-intro-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot9-intro-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/pilot8-visual-intro-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke intro PILOTE 9.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke intro PILOTE 9 en echec (code $($process.ExitCode))." }

      - name: Run real Electron Pilot 9 page 1 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot9-page1-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot9-page1-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/pilot9-page1-layout-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke page 1 PILOTE 9.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke page 1 PILOTE 9 en echec (code $($process.ExitCode))." }

      - name: Build isolated Windows Pilot 9 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot9-builder.yml --publish never

      - name: Verify Pilot 9 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-9-0.0.9-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 9 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT9_SETUP=$($setup.Name)"
          Write-Host "PILOT9_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-9-0.0.9-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-9-0.0.9-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 9 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-009'
          $title = 'SEB EvalPro Kalonéo — PILOTE #9'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #9 Windows pour test réel — correction ciblée de la page 1.

          - texte d'aide déplacé à droite du titre Prise en main
          - récupération de hauteur utile
          - blocs Chronomètre / Calculatrice / Audio remontés et agrandis
          - calculatrice de prise en main remontée et légèrement agrandie
          - aucun texte des petits blocs ne doit être masqué
          - boutons chrono conservés dans le style KALONÉO
          - Démarrer : texte vert uniquement
          - Arrêter : texte rouge uniquement
          - maisons et voiture améliorées visuellement
          - page 2 / mini vidéo du PILOTE 8 conservée sans changement
          - socle Admin / Bilan / Quitter / KALTEST conservé

          Décisions consignées dans docs/PILOTE-9-DECISIONS.md.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot9-page1-layout --title $title --notes $notes
