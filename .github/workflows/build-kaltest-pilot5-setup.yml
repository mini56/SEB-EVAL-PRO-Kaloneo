name: Build Windows KALTEST Pilot 5 setup

on:
  workflow_dispatch:
  push:
    branches:
      - dev-kaloneo-v2
    paths:
      - '.github/workflows/build-kaltest-pilot5-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 55

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Build 21 Admin foundation
        run: npm run test:admin-foundation

      - name: Generate Pilot 5 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Admin foundation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot5-admin-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot5-admin-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/build21-admin-foundation-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Admin PILOTE 5.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke Admin PILOTE 5 en echec (code $($process.ExitCode))." }

      - name: Run real Electron KALTEST smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot5-kaltest-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot5-kaltest-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke KALTEST PILOTE 5.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke KALTEST PILOTE 5 en echec (code $($process.ExitCode))." }

      - name: Build isolated Windows Pilot 5 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot5-builder.yml --publish never

      - name: Verify Pilot 5 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-5-0.0.5-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 5 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT5_SETUP=$($setup.Name)"
          Write-Host "PILOT5_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-5-0.0.5-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-5-0.0.5-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 5 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-005'
          $title = 'SEB EvalPro Kalonéo — PILOTE #5'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #5 Windows pour test réel.

          Depuis PILOTE #4 :
          - boutons de barre Admin contenus dans 36 px pour une barre de 44 px
          - suppression des débordements et chevauchements
          - Quitter affiché en rouge
          - Exporter avec flèche vers le haut
          - Importer avec flèche vers le bas
          - suppression du doublon visible Terminer le parcours du candidat
          - Fermer la session active est l'unique commande de fin de parcours
          - bouton de confidentialité retiré de la barre Admin
          - bulles d'aide communes au survol des boutons Admin
          - nouveau bouton Tests / Parcours
          - page Tests / Parcours volontairement vide avec seulement Fermer
          - garde Build #21 et smoke Electron étendus à ces comportements

          Aucun nouveau travail de mise en page des exercices n'a été ajouté dans ce lot.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target dev-kaloneo-v2 --title $title --notes $notes
