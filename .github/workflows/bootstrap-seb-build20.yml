name: Bootstrap SEB EvalPro Build 20

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-seb-build20.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import validated SEB EvalPro Build 20 baseline
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="https://github.com/mini56/SEB-EvalPro.git"
          SOURCE_COMMIT="cd7360f33186a41107b84fdd901724c9acb23ea2"
          TMP_DIR="${RUNNER_TEMP}/seb-evalpro-build20"

          rm -rf "${TMP_DIR}"
          git clone "${SOURCE_REPO}" "${TMP_DIR}"
          git -C "${TMP_DIR}" checkout "${SOURCE_COMMIT}"

          if command -v git-lfs >/dev/null 2>&1; then
            git -C "${TMP_DIR}" lfs pull || true
          fi

          rm -rf "${TMP_DIR}/.git"
          mkdir -p seb-evalpro
          rsync -a --delete "${TMP_DIR}/" seb-evalpro/

          cat > seb-evalpro/BASELINE.md <<'EOF'
          # Baseline importée

          Cette arborescence provient de SEB EvalPro 0.3.10 — Build #20.

          - dépôt source : mini56/SEB-EvalPro
          - commit source : cd7360f33186a41107b84fdd901724c9acb23ea2
          - rôle : socle fonctionnel de départ pour la nouvelle architecture
          - statut : référence historique importée, à migrer progressivement vers KALTEST

          Le dépôt source reste indépendant et n'est pas modifié par ce dépôt.
          EOF

      - name: Verify baseline identity
        shell: bash
        run: |
          set -euo pipefail
          test -f seb-evalpro/package.json
          test -d seb-evalpro/source
          test -d seb-evalpro/src
          test -d seb-evalpro/scripts

          node - <<'NODE'
          const p = require('./seb-evalpro/package.json');
          if (String(p.version) !== '0.3.10') {
            throw new Error('Version source inattendue: ' + p.version);
          }
          if (String(p.sebBuildNumber) !== '20') {
            throw new Error('Build source inattendu: ' + p.sebBuildNumber);
          }
          console.log('BASELINE_SEB_VERSION=' + p.version);
          console.log('BASELINE_SEB_BUILD=' + p.sebBuildNumber);
          NODE

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seb-evalpro

          if git diff --cached --quiet; then
            echo "Baseline already imported."
            exit 0
          fi

          git commit -m "Import validated SEB EvalPro Build 20 baseline"
          git push origin main
