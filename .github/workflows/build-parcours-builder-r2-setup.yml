name: Build Windows KALONÉO PILOTE 22 R2

on:
  workflow_dispatch:
  push:
    branches:
      - parcours-builder-r2
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - '.github/workflows/build-parcours-builder-r2-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library and business rules
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify parcours builder R2 in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify KALONÉO Builder R2 full Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R2 setup
        run: npx electron-builder --win nsis --config build/kaloneo-parcours-r2-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R2-0.0.23-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R2 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOTE_22_R2_SETUP=$($setup.Name)"
          Write-Host "PILOTE_22_R2_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R2-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R2-0.0.23-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r2'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R2 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R2.

          Corrections incluses :
          - trois scrolls indépendants Bibliothèque / Parcours / Parcours enregistrés ;
          - Annuler et Enregistrer déplacés en haut ;
          - glisser-déposer souris réel Bibliothèque ↔ Parcours ;
          - réordonnancement des tests par glisser-déposer ;
          - correction du chevauchement Fin de parcours / zone de dépôt ;
          - suppression du bouton global Afficher l’écran d’accueil dans Tests / Parcours et l’aperçu ;
          - boutons harmonisés KALONÉO sans ombres parasites ;
          - vraie calculatrice commune SEB EvalPro / KALONÉO, déplaçable ;
          - KALONÉO par défaut en bas de la calculatrice, texte configurable ;
          - bouton Ouvrir la calculatrice conforme ;
          - média unique étiré sur toute la hauteur disponible de sa zone ;
          - persistance, unicité du nom et créateur obligatoire conservés.

          Ce Setup reste un pilote de test et ne remplace pas PILOTE 21 R3 comme référence validée.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target parcours-builder-r2 --title $title --notes $notes
