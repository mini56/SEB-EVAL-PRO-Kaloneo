name: Build Windows KALONÉO PILOTE 22 R6

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r6
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - 'docs/KALONEO-DECISIONS-VALIDEES.md'
      - '.github/workflows/build-test-builder-r6-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library editing selection and runtime
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify onboarding resume layout in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-onboarding-resume-layout-smoke-main.js

      - name: Verify Tests Parcours alignment in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-tests-parcours-layout-smoke-main.js

      - name: Verify saved parcours opening and editing in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify Admin parcours choice and lock in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-choice-electron-smoke-main.js

      - name: Verify selected parcours candidate runtime in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js

      - name: Verify Test Builder in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify mask builder and true Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-mask-builder-electron-smoke-main.js

      - name: Verify manual free-text Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-manual-bilan-electron-smoke-main.js

      - name: Verify historical full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R6 setup
        run: npx electron-builder --win nsis --config build/kaloneo-test-builder-r6-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R6-0.0.26-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R6 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOTE_22_R6_SETUP=$($setup.Name)"
          Write-Host "PILOTE_22_R6_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R6-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R6-0.0.26-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r6'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R6 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R6.

          Inclus :
          - corrections R5 de reprise Maison/Voiture et mises en page Admin ;
          - ouverture et modification d’un parcours enregistré ;
          - détail complet d’un parcours avant choix ;
          - bouton Admin « Choix du parcours » ;
          - sélection d’un parcours puis verrouillage de la barre Admin ;
          - chargement réel du parcours sélectionné côté candidat ;
          - nom réel du parcours affiché dans l’introduction ;
          - écran de masquage automatiquement lié au parcours choisi ;
          - vrai aperçu Electron des écrans de masquage avec retour sans perte ;
          - bibliothèque de tests, texte libre / Bilan manuel et protections R4 conservés.

          Ce Setup reste un pilote de test et ne remplace pas PILOTE 21 R3 comme référence stable tant que le test réel n’est pas validé.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target test-builder-r6 --title $title --notes $notes
