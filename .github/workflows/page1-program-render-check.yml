name: Render Program Page 1 check

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - 'seb-evalpro/source/kaltest-pilot2.html'
      - 'seb-evalpro/source/css/kaltest-page1-validated.css'
      - 'seb-evalpro/source/css/seb-design-system.css'
      - 'seb-evalpro/source/js/kaltest-pilot2-onboarding.js'
      - 'seb-evalpro/source/js/seb-floating-calculator.js'
      - '.github/workflows/page1-program-render-check.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot10-page1-readability

      - name: Prepare program render states
        shell: bash
        run: |
          mkdir -p docs/render-check
          cp seb-evalpro/source/kaltest-pilot2.html seb-evalpro/source/kaltest-pilot2-render-initial.html
          python - <<'PY'
          from pathlib import Path
          src_path=Path("seb-evalpro/source/kaltest-pilot2.html")
          src=src_path.read_text(encoding="utf-8")

          open_script = r"""
          <script>
          window.addEventListener('load', () => {
            setTimeout(() => {
              const b=document.getElementById('pilot2-calculator-test-open');
              if (b) b.click();
            }, 250);
          });
          </script>
          """
          Path("seb-evalpro/source/kaltest-pilot2-render-calc.html").write_text(
            src.replace("</body>", open_script + "</body>"), encoding="utf-8"
          )

          completed_script = r"""
          <script>
          window.addEventListener('load', () => {
            setTimeout(() => {
              try {
                window.sebPilot2Onboarding?.placeHouse?.();
                window.sebPilot2Onboarding?.placeCar?.();
                window.sebPilot2Onboarding?.startChrono?.();
                setTimeout(() => {
                  window.sebPilot2Onboarding?.stopChrono?.();
                  const c=document.getElementById('pilot2-calculator-test-open');
                  if(c) c.click();
                  const a=document.getElementById('pilot2-audio-heard');
                  if(a){ a.checked=true; a.dispatchEvent(new Event('change',{bubbles:true})); }
                  try { window.closeCalculator?.(); } catch (_) {}
                }, 350);
              } catch (_) {}
            }, 250);
          });
          </script>
          """
          Path("seb-evalpro/source/kaltest-pilot2-render-completed.html").write_text(
            src.replace("</body>", completed_script + "</body>"), encoding="utf-8"
          )
          PY

      - name: Render actual program at 1366x768
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for STATE in initial calc completed; do
            "$CHROME"               --headless=new               --no-sandbox               --disable-gpu               --hide-scrollbars               --window-size=1366,768               --virtual-time-budget=1800               --screenshot="docs/render-check/program-page1-${STATE}-1366x768.png"               "file://$GITHUB_WORKSPACE/seb-evalpro/source/kaltest-pilot2-render-${STATE}.html"
          done

      - name: Remove temporary render pages
        shell: bash
        run: rm -f seb-evalpro/source/kaltest-pilot2-render-*.html

      - name: Commit program render checks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/render-check/program-page1-*-1366x768.png
          git diff --cached --quiet || git commit -m "Render integrated Page 1 program at 1366x768"
          git push origin HEAD:pilot10-page1-readability
