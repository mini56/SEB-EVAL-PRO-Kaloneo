name: Build Windows KALTEST Pilot 14 common navigation

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - '.github/workflows/build-kaltest-pilot14-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA
        run: npm run test:seb-ia

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app
        run: npm run prepare:web

      - name: Verify candidate catalog
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run full real Electron regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $smokes = @(
            'scripts/build21-admin-foundation-smoke-main.js',
            'scripts/pilot13-layout-smoke-main.js',
            'scripts/pilot14-common-nav-bullets-smoke-main.js',
            'scripts/kaltest-pilot2-functional-smoke-main.js',
            'scripts/pilot8-visual-intro-smoke-main.js',
            'scripts/pilot10-page1-render-main.js',
            'scripts/qcm-page4-functional-smoke-main.js',
            'scripts/qcm-page5-functional-smoke-main.js',
            'scripts/qcm-page5-1-functional-smoke-main.js',
            'scripts/autoeval1-functional-smoke-main.js',
            'scripts/planning-functional-smoke-main.js',
            'scripts/dictee-functional-smoke-main.js',
            'scripts/brique-functional-smoke-main.js',
            'scripts/real-brique-electron-render-main.js',
            'scripts/stock-functional-smoke-main.js',
            'scripts/real-stock-electron-test-main.js',
            'scripts/tri-functional-smoke-main.js',
            'scripts/nwtexte-functional-smoke-main.js',
            'scripts/nvmail-functional-smoke-main.js',
            'scripts/autoeval2-functional-smoke-main.js',
            'scripts/carre-functional-smoke-main.js',
            'scripts/qcm-final-functional-smoke-main.js',
            'scripts/full-pilot-journey-smoke-main.js'
          )
          foreach ($smoke in $smokes) {
            Write-Host "=== REAL ELECTRON: $smoke ==="
            $safe = ($smoke -replace '[^A-Za-z0-9_-]','_')
            $stdout = Join-Path $env:RUNNER_TEMP "$safe-out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$safe-err.log"
            $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox',$smoke -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Timeout du smoke $smoke"
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "Smoke $smoke en echec (code $($process.ExitCode))." }
          }

      - name: Verify Pilot 14 launcher contract
        shell: pwsh
        run: |
          $main = Get-Content -Raw 'src/kaltest-pilot14-main.js'
          $core = Get-Content -Raw 'src/main.js'
          if ($main -notmatch "SEB_KALTEST_FULL_PARCOURS = '1'") { throw 'PILOTE 14 ne force pas le mode parcours complet.' }
          if ($core -notmatch "fullParcours:'1'") { throw 'main.js ne transmet pas fullParcours=1.' }
          Write-Host 'PILOT14_FULL_PARCOURS_LAUNCHER=OK'

      - name: Build isolated Windows Pilot 14 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot14-builder.yml --publish never

      - name: Verify Pilot 14 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-14-0.0.14-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 14 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT14_SETUP=$($setup.Name)"
          Write-Host "PILOT14_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-14-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-14-0.0.14-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 14 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-014'
          $title = 'SEB EvalPro Kalonéo — PILOTE #14'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #14 Windows — harmonisation générale de la navigation.

          Cette version ne modifie pas les mises en page métier ni les images du PILOTE 13.

          Principales évolutions :
          - barre de navigation basse commune KALONÉO ;
          - fond transparent / légèrement translucide avec fine séparation gris-bleu ;
          - aucune ombre lourde sur la barre ;
          - boutons KALONÉO à hauteur identique sur toutes les pages ;
          - Abandonner placé dans la zone gauche ;
          - actions de progression / validation placées dans la zone centrale ;
          - les boutons d'origine restent fonctionnels en coulisses : leurs événements, ID, barèmes et verrouillages sont conservés ;
          - aucun bouton Vérifier n'est supprimé : lorsqu'il participe au déroulement de l'exercice, il reste actif ;
          - API de déclaration prévue pour les futurs tests KALONÉO ;
          - une seule puce de liste officielle dans les exercices et consignes : le gros point • ;
          - aucun ajout d'image ni autre retouche de page dans ce pilote.

          Le build valide le composant commun, les exercices concernés et le parcours complet avant publication.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot10-page1-readability --title $title --notes $notes
