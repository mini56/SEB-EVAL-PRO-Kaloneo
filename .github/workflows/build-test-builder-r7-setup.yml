name: Build Windows KALONÉO PILOTE 22 R7

on:
  workflow_dispatch:
  push:
    branches:
      - test-builder-r7
    paths:
      - 'seb-evalpro/**'
      - 'kaloneo/**'
      - 'docs/KALONEO-DECISIONS-VALIDEES.md'
      - '.github/workflows/build-test-builder-r7-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify parcours library selection launch options and runtime
        run: npm run test:parcours-builder

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app and regression guards
        run: npm run prepare:web

      - name: Verify corrections policy Planning Stock Paronymes
        run: npx electron --no-sandbox scripts/kaloneo-correction-policy-electron-smoke-main.js

      - name: Verify dynamic final page closes active candidate
        run: npx electron --no-sandbox scripts/kaloneo-final-completion-electron-smoke-main.js

      - name: Verify Admin Bilan keeps vertical scrolling
        run: npx electron --no-sandbox scripts/admin-bilan-windows-smoke.js

      - name: Verify candidate catalog including parcours name
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify onboarding resume layout in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-onboarding-resume-layout-smoke-main.js

      - name: Verify Tests Parcours alignment in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-tests-parcours-layout-smoke-main.js

      - name: Verify saved parcours opening and editing in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-parcours-builder-electron-smoke-main.js

      - name: Verify Admin parcours choice correction toggle and lock
        run: npx electron --no-sandbox scripts/kaloneo-parcours-choice-electron-smoke-main.js

      - name: Verify selected parcours candidate runtime in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-selected-parcours-electron-smoke-main.js

      - name: Verify Test Builder in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-builder-preview-electron-smoke-main.js

      - name: Verify mask builder and true Electron preview
        run: npx electron --no-sandbox scripts/kaloneo-mask-builder-electron-smoke-main.js

      - name: Verify manual free-text Bilan in real Electron
        run: npx electron --no-sandbox scripts/kaloneo-manual-bilan-electron-smoke-main.js

      - name: Verify historical full KALTEST candidate journey
        run: npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify existing parcours registry
        run: npm run test:parcours

      - name: Build Windows PILOTE 22 R7 setup
        run: npx electron-builder --win nsis --config build/kaloneo-test-builder-r7-builder.yml --publish never

      - name: Verify setup and hash
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-22-R7-0.0.27-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 22 R7 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOTE_22_R7_SETUP=$($setup.Name)"
          Write-Host "PILOTE_22_R7_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-22-R7-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-22-R7-0.0.27-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-parcours-v1-test-r7'
          $title = 'SEB EvalPro Kalonéo — PILOTE 22 R7 TEST'
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          $notes = @"
          Setup Windows de TEST — PILOTE 22 R7.

          Corrections principales :
          - corrections candidat masquées par défaut sur tout le parcours ;
          - option Admin « Afficher les corrections pendant le parcours : Non / Oui », avec Non par défaut ;
          - politique vérifiée en Electron sur Planning, Stock, Paronymes et moteur KALTEST commun ;
          - fin d’un parcours dynamique clôt correctement le candidat : aucune fausse reprise au prochain démarrage ;
          - fiche candidat : affichage du nom réel du parcours effectué ;
          - Bilan Administrateur : défilement vertical restauré ;
          - choix du parcours, ordre des tests et écran de masquage liés au parcours conservés ;
          - protections et fonctions validées des R4/R5/R6 conservées.

          Ce Setup reste un pilote de test et ne remplace pas PILOTE 21 R3 comme référence stable tant que le test réel n’est pas validé.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target test-builder-r7 --title $title --notes $notes
