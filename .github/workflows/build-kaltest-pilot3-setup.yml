name: Build Windows KALTEST Pilot 3 setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 50

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Validate KALTEST contract
        working-directory: kaltest-contract
        run: npm test

      - name: Generate Pilot 3 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Run real Electron Pilot 3 smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot3-smoke-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot3-smoke-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Electron PILOTE 3 après 150 secondes.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "Smoke Electron PILOTE 3 en echec (code $($process.ExitCode))."
          }

      - name: Build isolated Windows Pilot 3 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot3-builder.yml --publish never

      - name: Verify Pilot 3 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-3-0.0.3-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) {
            throw 'Setup PILOTE 3 introuvable.'
          }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT3_SETUP=$($setup.Name)"
          Write-Host "PILOT3_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-3-0.0.3-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-3-0.0.3-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 3 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-003'
          $title = 'SEB EvalPro Kalonéo — PILOTE #3'
          if (gh release view $tag 2>$null) {
            throw "La Release $tag existe deja. Utiliser un nouveau numero de pilote."
          }
          $notes = @"
          PILOTE #3 Windows destiné au nouveau test réel KALONÉO / KALTEST.

          Corrections principales depuis PILOTE #2 :
          - barre Administrateur contextuelle et repli corrigé
          - fin normale du parcours raccordée au moteur commun
          - mise en page KALONÉO plus proche de la lisibilité Build #20
          - Genre / Nombre en deux tableaux
          - Paronymes agrandi
          - calculatrice fermée au changement de page et affichée seulement sur les tests compatibles
          - exemples de réponses retirés des champs Réception / Contrôle
          - date candidat propagée
          - pont Résultats / Bilan corrigé pour les tests KALTEST
          - capture Replay explicite à chaque fin d'exercice

          Le pilote possède son propre dossier de données isolé.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target dev-kaloneo-v2 --title $title --notes $notes
