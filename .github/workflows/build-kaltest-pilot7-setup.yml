# PILOT7_RETRY_3
name: Build Windows KALTEST Pilot 7 setup

on:
  workflow_dispatch:
  push:
    branches:
      - pilot7-start-page
    paths:
      - '.github/workflows/build-kaltest-pilot7-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SEB dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Build 21 Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA and repository identity audit
        run: npm run test:seb-ia

      - name: Generate Pilot 7 data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare SEB web application
        run: npm run prepare:web

      - name: Verify candidate catalog engine
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter and active-session semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run real Electron Admin foundation smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot7-admin-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot7-admin-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/build21-admin-foundation-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke Admin PILOTE 7.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke Admin PILOTE 7 en echec (code $($process.ExitCode))." }

      - name: Run real Electron KALTEST regression smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot7-kaltest-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot7-kaltest-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/kaltest-pilot2-functional-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke KALTEST PILOTE 7.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke KALTEST PILOTE 7 en echec (code $($process.ExitCode))." }

      - name: Run real Electron Pilot 7 start-page smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'pilot7-start-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pilot7-start-err.log'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox','scripts/pilot7-start-page-smoke-main.js' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(150000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Timeout du smoke page accueil PILOTE 7.'
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Smoke page accueil PILOTE 7 en echec (code $($process.ExitCode))." }

      - name: Build isolated Windows Pilot 7 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot7-builder.yml --publish never

      - name: Verify Pilot 7 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-7-0.0.7-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 7 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT7_SETUP=$($setup.Name)"
          Write-Host "PILOT7_SHA256=$hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-7-0.0.7-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-7-0.0.7-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 7 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-007'
          $title = 'SEB EvalPro Kalonéo — PILOTE #7'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #7 Windows pour test réel.

          Corrections et améliorations après le test du PILOTE #6 :
          - Quitter n'annonce plus de faux parcours candidat lorsqu'aucun parcours n'est actif
          - aucune sauvegarde artificielle de la page d'identification vide à la fermeture
          - Fermer la session active reste réservé à un vrai parcours EN_COURS
          - page candidat réorganisée en deux colonnes avec champs moins larges
          - prise en main non notée ajoutée sous l'identité
          - test souris : maison à placer entre deux maisons et voiture à placer sur le parking
          - chronomètre à deux boutons dans le style KALONÉO validé
          - test calculatrice avec bouton Ouvrir et ouverture dans la zone droite
          - test audio hors ligne avec confirmation Son entendu
          - page Introduction rééquilibrée : image centrée dans l'espace disponible
          - calculatrice déplacée à droite pour ne plus masquer les consignes
          - barre Admin et Bilan du PILOTE #6 conservés sans régression

          Les décisions fonctionnelles sont consignées dans docs/PILOTE-7-DECISIONS.md.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot7-start-page --title $title --notes $notes
