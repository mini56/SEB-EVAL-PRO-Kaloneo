name: Build Windows KALTEST Pilot 11 full parcours

on:
  workflow_dispatch:
  push:
    branches:
      - pilot10-page1-readability
    paths:
      - '.github/workflows/build-kaltest-pilot11-setup.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 75

    defaults:
      run:
        working-directory: seb-evalpro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Admin foundation
        run: npm run test:admin-foundation

      - name: Verify SEB-IA
        run: npm run test:seb-ia

      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js

      - name: Prepare real web app
        run: npm run prepare:web

      - name: Verify candidate catalog
        run: node scripts/candidate-catalog-smoke.js

      - name: Verify Quitter semantics
        run: node scripts/admin-quit-regression-smoke.js

      - name: Run full real Electron regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $electron = Join-Path (Get-Location) 'node_modules/.bin/electron.cmd'
          $smokes = @(
            'scripts/build21-admin-foundation-smoke-main.js',
            'scripts/kaltest-pilot2-functional-smoke-main.js',
            'scripts/pilot8-visual-intro-smoke-main.js',
            'scripts/pilot10-page1-render-main.js',
            'scripts/real-test1-electron-render-main.js',
            'scripts/brique-functional-smoke-main.js',
            'scripts/real-brique-electron-render-main.js',
            'scripts/stock-functional-smoke-main.js',
            'scripts/real-stock-electron-test-main.js',
            'scripts/full-pilot-journey-smoke-main.js'
          )

          foreach ($smoke in $smokes) {
            Write-Host "=== REAL ELECTRON: $smoke ==="
            $safe = ($smoke -replace '[^A-Za-z0-9_-]','_')
            $stdout = Join-Path $env:RUNNER_TEMP "$safe-out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$safe-err.log"
            $process = Start-Process -FilePath $electron -ArgumentList '--no-sandbox',$smoke -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Timeout du smoke $smoke"
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) {
              throw "Smoke $smoke en echec (code $($process.ExitCode))."
            }
          }

      - name: Verify full-parcours launcher contract
        shell: pwsh
        run: |
          $main = Get-Content -Raw 'src/kaltest-pilot11-main.js'
          $core = Get-Content -Raw 'src/main.js'
          if ($main -notmatch "SEB_KALTEST_FULL_PARCOURS = '1'") { throw 'PILOTE 11 ne force pas le mode parcours complet.' }
          if ($core -notmatch "fullParcours:'1'") { throw 'main.js ne transmet pas fullParcours=1 au renderer.' }
          Write-Host 'PILOT11_FULL_PARCOURS_LAUNCHER=OK'

      - name: Build isolated Windows Pilot 11 setup
        run: npx electron-builder --win nsis --config build/kaltest-pilot11-builder.yml --publish never

      - name: Verify Pilot 11 setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter 'SEB-EvalPro-Kaloneo-PILOTE-11-0.0.11-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup PILOTE 11 introuvable.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToUpperInvariant()
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PILOT11_SETUP=$($setup.Name)"
          Write-Host "PILOT11_SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Kaloneo-PILOTE-11-0.0.11-Windows
          path: seb-evalpro/dist/SEB-EvalPro-Kaloneo-PILOTE-11-0.0.11-Windows-Setup.exe
          if-no-files-found: error

      - name: Publish Pilot 11 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'seb-kaloneo-pilot-011'
          $title = 'SEB EvalPro Kalonéo — PILOTE #11'
          if (gh release view $tag 2>$null) { throw "La Release $tag existe deja." }
          $notes = @"
          PILOTE #11 Windows — parcours complet corrigé.

          Correction principale :
          - le PILOTE 10 s'arrêtait après les 7 tests KALTEST ;
          - le PILOTE 11 enchaîne maintenant vers Autoévaluation 1 ;
          - puis la vraie vidéo Briques video_brique.mp4 ;
          - puis LEGO / Briques ;
          - puis Stock ;
          - puis la suite du parcours central.

          Vérifications avant publication :
          - introduction KALONÉO visible ;
          - handoff KALTEST -> autoeval1 ;
          - vidéo Briques présente et autoplay ;
          - page LEGO réelle ;
          - page Stock réelle ;
          - Stock 33/33, 0 erreur, sauvegarde/reprise ;
          - Admin, KALTEST, Page 1, LEGO, Stock et garde-fous architecture tous VERTS.

          Fichier : $env:SETUP_NAME
          SHA256 : $env:SETUP_SHA256
          "@
          gh release create $tag $env:SETUP_PATH --target pilot10-page1-readability --title $title --notes $notes
