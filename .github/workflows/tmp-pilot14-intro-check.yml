name: Temporary Pilot 14 intro robustness check

on:
  push:
    branches:
      - pilot14-intro-autoplay-robustness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: seb-evalpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate KALTEST data
        run: node scripts/build-kaltest-pilot2-data.js
      - name: Prepare
        run: npm run prepare:web
      - name: Intro autoplay
        run: xvfb-run -a npx electron --no-sandbox scripts/pilot8-visual-intro-smoke-main.js
      - name: Common navigation
        run: xvfb-run -a npx electron --no-sandbox scripts/pilot14-common-nav-bullets-smoke-main.js
      - name: Full parcours
        run: xvfb-run -a npx electron --no-sandbox scripts/full-pilot-journey-smoke-main.js
